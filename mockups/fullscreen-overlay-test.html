<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MacLiveTranslator Fullscreen Overlay Test</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #0d1117;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      display: grid;
      min-height: 100%;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(14, 165, 233, 0.85), rgba(244, 63, 94, 0.85)),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.14) 0 20px, rgba(0, 0, 0, 0.14) 20px 40px);
    }

    .label {
      padding: 24px 32px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.22);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.36);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 42px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="label">
      <h1>Fullscreen Overlay Test</h1>
      <p>The black caption panel should stay visible over this page.</p>
    </section>
  </main>
</body>
</html>
